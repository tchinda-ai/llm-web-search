# SearXNG minimal configuration for local Docker use
use_default_settings: true

server:
  secret_key: "llm-web-search-searxng-secret-key-local"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  default_lang: "en-US"
  timeout_limit: 15.0
  ban_time_on_fail: 0
  max_ban_time_on_fail: 0
  suspended_times:
    SearxEngineAccessDenied: 0
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 0
    cf_SearxEngineCaptcha: 0
    cf_SearxEngineAccessDenied: 0
    recaptcha_SearxEngineCaptcha: 0

outgoing:
  request_timeout: 10.0
  connect_timeout: 10.0
  proxies:
    "all://":
      - http://54fbdf522c44f7953be6__cr.us:cafb6648b70eddf4@gw.dataimpulse.com:823
      - http://54fbdf522c44f7953be6__cr.fr:cafb6648b70eddf4@gw.dataimpulse.com:823
      - http://54fbdf522c44f7953be6:cafb6648b70eddf4@gw.dataimpulse.com:823

botdetection:
  ip_lists:
    pass_ip:
      - 172.0.0.0/8
      - 192.168.0.0/16
      - 10.0.0.0/8
      - 127.0.0.0/8
    pass_searxng_org: true

engines:
  - name: google
    engine: google
    disabled: false

  - name: google news
    engine: google_news
    disabled: false

  - name: bing
    engine: bing
    disabled: false

  - name: qwant
    engine: qwant
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    disabled: false

  - name: brave
    disabled: true

  - name: startpage
    disabled: true

  - name: karmasearch
    disabled: true

  - name: wikipedia
    disabled: false

  - name: wikidata
    disabled: true

  - name: ahmia
    disabled: true

  - name: torch
    disabled: true
